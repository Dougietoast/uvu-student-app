groups:
  - name: student-app
    rules:
      - alert: StudentAppDown
        expr: probe_success{job="student-app-http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Student app is not responding: {{ $labels.instance }}"
          description: "The HTTP probe has failed for more than 1 minute."

      - alert: StudentAppSlow
        expr: probe_duration_seconds{job="student-app-http"} > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Student app is slow: {{ $labels.instance }}"
          description: "Responses have taken longer than 1 second for 5 minutes."

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target down: {{ $labels.job }} ({{ $labels.instance }})"
          description: "Prometheus could not collect metrics from this target for 1 minute."

  - name: vm
    rules:
      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "VM memory usage above 90%"
          description: "Memory has been above 90% for 5 minutes."

      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Root disk above 85% full"
          description: "The VM's root filesystem has been above 85% for 10 minutes."
